version: '3.8'

services:
  nlp-service:
    build:
      context: ../nlp
      dockerfile: Dockerfile
    image: oran-nlp-service:latest
    container_name: oran-nlp-service
    ports:
      - "8082:8082"
    environment:
      - NLP_LOG_LEVEL=info
      - NLP_PORT=8082
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8082/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - oran-network

  orchestrator:
    build:
      context: ../orchestrator
      dockerfile: ../deploy/docker/orchestrator/Dockerfile
    image: oran-orchestrator:latest
    container_name: oran-orchestrator
    ports:
      - "8080:8080"
      - "9090:9090"
    environment:
      - NLP_SERVICE_URL=http://nlp-service:8082
      - LOG_LEVEL=info
    command: ["--server", "--port=8080", "--metrics-port=9090"]
    depends_on:
      - nlp-service
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - oran-network

networks:
  oran-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
