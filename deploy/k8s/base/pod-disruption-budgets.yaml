---
# Pod Disruption Budget for ORAN Orchestrator
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: oran-orchestrator-pdb
  namespace: oran-mano
  labels:
    app.kubernetes.io/name: oran-orchestrator
    app.kubernetes.io/component: orchestrator
    app.kubernetes.io/part-of: oran-intent-mano
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: oran-orchestrator
