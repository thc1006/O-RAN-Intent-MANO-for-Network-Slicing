---
# HorizontalPodAutoscaler for Security Scanner
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: oran-security-scanner-hpa
  namespace: oran-mano
  labels:
    app.kubernetes.io/name: oran-security-scanner
    app.kubernetes.io/component: security-validation
    app.kubernetes.io/part-of: oran-intent-mano
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: oran-security-scanner
  minReplicas: 2
  maxReplicas: 6
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 80
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 85
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 30
        periodSeconds: 60
      selectPolicy: Min
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 50
        periodSeconds: 30
      selectPolicy: Max