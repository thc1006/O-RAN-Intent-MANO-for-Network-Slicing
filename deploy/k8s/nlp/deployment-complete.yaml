apiVersion: v1
kind: Namespace
metadata:
  name: oran-nlp
  labels:
    name: oran-nlp
    component: nlp-service
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nlp-config
  namespace: oran-nlp
data:
  NLP_LOG_LEVEL: "info"
  NLP_PORT: "8082"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nlp-service
  namespace: oran-nlp
  labels:
    app: nlp-service
    component: nlp
    version: v1.0.0
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nlp-service
  template:
    metadata:
      labels:
        app: nlp-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8082"
    spec:
      containers:
      - name: nlp-service
        image: oran-nlp-service:latest
        ports:
        - containerPort: 8082
          name: http
        env:
        - name: NLP_LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: nlp-config
              key: NLP_LOG_LEVEL
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: nlp-service
  namespace: oran-nlp
spec:
  type: ClusterIP
  ports:
  - port: 8082
    targetPort: http
    name: http
  selector:
    app: nlp-service
