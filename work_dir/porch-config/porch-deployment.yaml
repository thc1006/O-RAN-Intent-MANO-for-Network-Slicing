apiVersion: v1
kind: ServiceAccount
metadata:
  name: porch-server
  namespace: porch-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: porch-server
rules:
  - apiGroups: ["porch.kpt.dev"]
    resources: ["packagerevisions", "repositories"]
    verbs: ["*"]
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: porch-server
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: porch-server
subjects:
  - kind: ServiceAccount
    name: porch-server
    namespace: porch-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: porch-server
  namespace: porch-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: porch-server
  template:
    metadata:
      labels:
        app: porch-server
    spec:
      serviceAccountName: porch-server
      containers:
        - name: porch-server
          image: gcr.io/kpt-dev/porch-server:v0.0.27
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: api
          env:
            - name: LOG_LEVEL
              value: "debug"
          resources:
            limits:
              memory: "512Mi"
              cpu: "500m"
            requests:
              memory: "256Mi"
              cpu: "100m"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: porch-server
  namespace: porch-system
spec:
  type: NodePort
  selector:
    app: porch-server
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
      name: api