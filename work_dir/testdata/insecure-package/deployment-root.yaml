apiVersion: apps/v1
kind: Deployment
metadata:
  name: insecure-deployment
  namespace: test-namespace
spec:
  replicas: 3
  selector:
    matchLabels:
      app: insecure-app
  template:
    metadata:
      labels:
        app: insecure-app
    spec:
      containers:
      - name: app-container
        image: myapp:latest
        securityContext:
          runAsUser: 0
          runAsNonRoot: false
        volumeMounts:
        - name: host-root
          mountPath: /host
      volumes:
      - name: host-root
        hostPath:
          path: /
          type: Directory