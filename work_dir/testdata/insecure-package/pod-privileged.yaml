apiVersion: v1
kind: Pod
metadata:
  name: insecure-pod
  namespace: test-namespace
spec:
  hostNetwork: true
  hostPID: true
  containers:
  - name: privileged-container
    image: nginx:latest
    securityContext:
      privileged: true
      runAsUser: 0
      allowPrivilegeEscalation: true
    ports:
    - containerPort: 80