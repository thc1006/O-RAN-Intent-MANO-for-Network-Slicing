# MockServer Configuration
# https://www.mock-server.com/mock_server/configuration_properties.html

# Log level
mockserver.logLevel=INFO

# CORS
mockserver.enableCORSForAPI=true
mockserver.enableCORSForAllResponses=true

# Request/Response Limits
mockserver.maxExpectations=1000
mockserver.maxWebSocketExpectations=1000

# Match request bodies strictly
mockserver.matchersFailFast=true

# Pretty print JSON logs
mockserver.prettyPrintJson=true

# Time-to-live for expectations (in seconds, 0 = unlimited)
mockserver.timeToLiveExpectation=0

# Disable TLS
mockserver.disableSystemOut=false

# Connection timeout
mockserver.maxSocketTimeout=120000

# Enable metrics
mockserver.metricsEnabled=true

# Memory management
mockserver.maxChunkSize=10485760
mockserver.maxInitialLineLength=4096
mockserver.maxHeaderSize=8192